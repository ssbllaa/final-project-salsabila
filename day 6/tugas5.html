<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Menampilkan Angka Menggunakan For Loop</h1>
    <ul id="list-angka"></ul>

    <script>
        let list = document.getElementById("list-angka");

        for (let i = 2; i <= 100; i+=2) {
            let item = document.createElement("li");
            item.textContent = "angka ke-" + i;

            list.appendChild(item);
        }
    </script>
</body>
</html>
