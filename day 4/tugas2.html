<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Operator Aritmetika dan Perbandingan</h2>
    <p id="Aritmetika"></p>
    <p id="Perbandingan"></p>
    
    <script>
        //Operator Aritmetika
        var a = 100;
        var b = 2;
        var hasilAritmetika = "Hasil Penjumlahan: " + (a + b) + "<br>" +
                              "Hasil Pengurangan: " + (a - b) + "<br>" +
                              "Hasil Perkalian: " + (a * b) + "<br>" +
                              "Hasil Pembagian: " + (a / b) + "<br>" +
                              "Hasil Sisa Bagi: " + (a % b);
        document.getElementById("Aritmetika").innerHTML = hasilAritmetika;

        //Operator Perbandingan dengan penjelasan
        var hasilPerbandingan = "Apakah a lebih besar dari b? " + (a > b) + "<br>" +
                                "Apakah a lebih kecil dari b? " + (a < b) + "<br>" +
                                "Apakah a sama dengan b? " + (a == b) + "<br>" +
                                "Apakah a tidak sama dengan b? " + (a != b) + "<br>" +
                                "Apakah a lebih besar atau sama dengan b? " + (a >= b) + "<br>" +
                                "Apapak a lebih kecil sama dengan b? " + (a <= b) + "<br>";
        document.getElementById("Perbandingan").innerHTML = "Hasil Perbandingan<br>" + hasilPerbandingan;
    </script>
</body>
</html>
